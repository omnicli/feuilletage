name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_pr != '' && format('Recover Feuilletage release from PR #{0}', inputs.release_pr) || github.event_name == 'workflow_dispatch' && 'Prepare Feuilletage release PR' || 'Check main push for merged Feuilletage release PR' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR number to recover; leave blank to prepare a release PR
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    name: Detect merged release PR
    if: ${{ github.repository == 'omnicli/feuilletage' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged-release-pr: ${{ steps.detect.outputs.merged-release-pr }}
    steps:
      - name: Check whether this exact commit merged a release PR
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          APP_NAME: ${{ vars.OMNICLI_APP_NAME }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -z "$APP_NAME" ]]; then
            echo "error: configure OMNICLI_APP_NAME as documented in RELEASING.md" >&2
            exit 1
          fi
          app_login=${APP_NAME,,}
          if [[ "$app_login" != *'[bot]' ]]; then
            app_login="${app_login}[bot]"
          fi

          pull_requests=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/$SHA/pulls")
          merged_release_pr=$(jq -r \
            --arg sha "$SHA" --arg repository "$REPOSITORY" --arg app_login "$app_login" '
            any(.[];
              .base.ref == "main"
              and (.head.ref | startswith("release-plz-"))
              and .head.repo.full_name == $repository
              and (.user.login | ascii_downcase) == $app_login
              and .merged_at != null
              and .merge_commit_sha == $sha
            )
          ' <<< "$pull_requests")

          if [[ "$merged_release_pr" != true ]]; then
            jq -r \
              --arg sha "$SHA" --arg repository "$REPOSITORY" --arg app_login "$app_login" '
              def result($passes): if $passes then "PASS" else "FAIL" end;
              if length == 0 then
                "FAIL commit association: GitHub returned no pull requests for \($sha)"
              else
                .[] |
                "Release authorization checks for PR #\(.number):",
                "  \(result(.base.ref == "main")) base branch: expected main, got \(.base.ref)",
                "  \(result(.head.ref | startswith("release-plz-"))) head branch: expected release-plz-*, got \(.head.ref)",
                "  \(result(.head.repo.full_name == $repository)) head repository: expected \($repository), got \(.head.repo.full_name)",
                "  \(result((.user.login | ascii_downcase) == $app_login)) author: expected \($app_login) (case-insensitive), got \(.user.login)",
                "  \(result(.merged_at != null)) merged state: merged_at=\(.merged_at)",
                "  \(result(.merge_commit_sha == $sha)) merge commit: expected \($sha), got \(.merge_commit_sha)"
              end
            ' <<< "$pull_requests" >&2
          fi
          echo "merged-release-pr=$merged_release_pr" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish merged release PR
    needs: release-context
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-context.outputs.merged-release-pr == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Authenticate to crates.io with OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish packages and reconcile release records
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-release.sh

  recovery-context:
    name: Validate release recovery request
    if: ${{ github.repository == 'omnicli/feuilletage' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-commit: ${{ steps.validate.outputs.release-commit }}
    steps:
      - name: Validate merged release PR
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          APP_NAME: ${{ vars.OMNICLI_APP_NAME }}
          PR_NUMBER: ${{ inputs.release_pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "error: release_pr must be a positive pull request number" >&2
            exit 1
          }
          if [[ -z "$APP_NAME" ]]; then
            echo "error: configure OMNICLI_APP_NAME as documented in RELEASING.md" >&2
            exit 1
          fi
          app_login=${APP_NAME,,}
          if [[ "$app_login" != *'[bot]' ]]; then
            app_login="${app_login}[bot]"
          fi

          pull_request=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")
          authorized=$(jq -r \
            --arg repository "$REPOSITORY" --arg app_login "$app_login" '
            .base.ref == "main"
            and (.head.ref | startswith("release-plz-"))
            and .head.repo.full_name == $repository
            and (.user.login | ascii_downcase) == $app_login
            and .merged_at != null
            and (.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' <<< "$pull_request")

          jq -r \
            --arg repository "$REPOSITORY" --arg app_login "$app_login" '
            def result($passes): if $passes then "PASS" else "FAIL" end;
            "Release recovery checks for PR #\(.number):",
            "  \(result(.base.ref == "main")) base branch: expected main, got \(.base.ref)",
            "  \(result(.head.ref | startswith("release-plz-"))) head branch: expected release-plz-*, got \(.head.ref)",
            "  \(result(.head.repo.full_name == $repository)) head repository: expected \($repository), got \(.head.repo.full_name)",
            "  \(result((.user.login | ascii_downcase) == $app_login)) author: expected \($app_login) (case-insensitive), got \(.user.login)",
            "  \(result(.merged_at != null)) merged state: merged_at=\(.merged_at)",
            "  \(result(.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$"))) merge commit: \(.merge_commit_sha)"
          ' <<< "$pull_request"

          [[ "$authorized" == true ]] || {
            echo "error: PR #$PR_NUMBER is not an authorized merged release PR" >&2
            exit 1
          }
          release_commit=$(jq -er '.merge_commit_sha' <<< "$pull_request")
          echo "release-commit=$release_commit" >> "$GITHUB_OUTPUT"

  recover-publish:
    name: Recover merged release PR publication
    needs: recovery-context
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_pr != '' && needs.recovery-context.outputs.release-commit != '' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.recovery-context.outputs.release-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release commit on main
        env:
          RELEASE_COMMIT: ${{ needs.recovery-context.outputs.release-commit }}
        run: |
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
          test -z "$(git status --porcelain)"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Authenticate to crates.io with OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish packages and reconcile release records
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.recovery-context.outputs.release-commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-release.sh

  release-pr:
    name: Prepare release PR (manual dispatch only)
    if: ${{ github.repository == 'omnicli/feuilletage' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_pr == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-main
      cancel-in-progress: true
    steps:
      - name: Require release PR GitHub App configuration
        env:
          APP_ID: ${{ secrets.OMNICLI_APP_ID }}
          APP_NAME: ${{ vars.OMNICLI_APP_NAME }}
          APP_PRIVATE_KEY: ${{ secrets.OMNICLI_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_NAME" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "error: configure OMNICLI_APP_ID, OMNICLI_APP_NAME, and OMNICLI_PRIVATE_KEY as documented in RELEASING.md" >&2
            exit 1
          fi

      - name: Create short-lived release PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OMNICLI_APP_ID }}
          private-key: ${{ secrets.OMNICLI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out complete release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Refresh latest main and wait for current versions
        run: |
          git fetch --force --prune origin +refs/heads/main:refs/remotes/origin/main
          git checkout --force -B main refs/remotes/origin/main
          git branch --set-upstream-to=origin/main main
          test -z "$(git status --porcelain)"
          ./scripts/wait-for-published-versions.sh

      - name: Create or update release PR
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
          version: 0.3.159
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
