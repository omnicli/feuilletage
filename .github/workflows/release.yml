name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Prepare Feuilletage release PR' || 'Check main push for merged Feuilletage release PR' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    name: Detect merged release PR
    if: ${{ github.repository == 'omnicli/feuilletage' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged-release-pr: ${{ steps.detect.outputs.merged-release-pr }}
    steps:
      - name: Check whether this exact commit merged a release PR
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          APP_LOGIN: ${{ vars.RELEASE_PR_APP_LOGIN }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -z "$APP_LOGIN" ]]; then
            echo "error: configure RELEASE_PR_APP_LOGIN as documented in RELEASING.md" >&2
            exit 1
          fi
          pull_requests=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/commits/$SHA/pulls")
          merged_release_pr=$(jq -r \
            --arg sha "$SHA" --arg repository "$REPOSITORY" --arg app_login "$APP_LOGIN" '
            any(.[];
              .base.ref == "main"
              and (.head.ref | startswith("release-plz-"))
              and .head.repo.full_name == $repository
              and .user.login == $app_login
              and .merged_at != null
              and .merge_commit_sha == $sha
            )
          ' <<< "$pull_requests")
          echo "merged-release-pr=$merged_release_pr" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish merged release PR
    needs: release-context
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-context.outputs.merged-release-pr == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Authenticate to crates.io with OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish packages and reconcile release records
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-release.sh

  release-pr:
    name: Prepare release PR (manual dispatch only)
    if: ${{ github.repository == 'omnicli/feuilletage' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-main
      cancel-in-progress: true
    steps:
      - name: Require release PR GitHub App configuration
        env:
          APP_ID: ${{ vars.RELEASE_PR_APP_ID }}
          APP_LOGIN: ${{ vars.RELEASE_PR_APP_LOGIN }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_LOGIN" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "error: configure RELEASE_PR_APP_ID, RELEASE_PR_APP_LOGIN, and RELEASE_PR_APP_PRIVATE_KEY as documented in RELEASING.md" >&2
            exit 1
          fi

      - name: Create short-lived release PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out complete release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Refresh latest main and wait for current versions
        run: |
          git fetch --force --prune origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach refs/remotes/origin/main
          test -z "$(git status --porcelain)"
          ./scripts/wait-for-published-versions.sh

      - name: Create or update release PR
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
          version: 0.3.159
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
