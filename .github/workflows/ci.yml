name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, clippy, and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check --workspace --all-targets --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - if: runner.os == 'Linux'
        run: cargo build --workspace --all-targets --all-features --locked
      - if: runner.os == 'Linux'
        run: cargo build --workspace --all-targets --all-features --release --locked
      - run: cargo test --workspace --all-features --locked --lib --tests
      - if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --locked --doc

  features-and-docs:
    name: Reduced features and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features-docs
      - run: ./scripts/check-feature-matrix.sh
      - run: cargo doc --workspace --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: ./scripts/check-rustdoc-example-coverage.sh

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check -p feuilletage --lib --all-features --locked
      - run: cargo check -p feuilletage-macros --all-features --locked

  workspace-hygiene:
    name: Examples, dependencies, and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hygiene
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: ./scripts/run-examples.sh
      - run: cargo machete --with-metadata
      - run: ./scripts/test-release-automation.sh
      - run: ./scripts/check-packages.sh
